# ==============================================================================
# pyproject.toml
#
# Project      : Taxi Route Recommender System
# Repository   : Taxi-Route-Recommender-Replication
# Author       : Rohit Shetye
# Version      : 2.0.0
# License      : MIT
# Python       : 3.10
#
# Description:
# Modern Python project configuration for packaging, testing,
# formatting, linting, and continuous integration.
# ==============================================================================

[build-system]
requires = [
    "setuptools>=68.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

# ==============================================================================
# Project Metadata
# ==============================================================================

[project]

name = "taxi-route-recommender"

version = "2.0.0"

description = "Research replication of A Cost-Effective Sequential Route Recommender System for Taxi Drivers"

readme = "README.md"

requires-python = ">=3.10,<3.11"

license = { text = "MIT" }

authors = [
    { name = "Rohit Shetye" }
]

keywords = [
    "machine-learning",
    "deep-learning",
    "graph-neural-network",
    "gcn",
    "lstm",
    "transportation",
    "trajectory-prediction",
    "route-recommendation",
    "taxi",
    "research-replication"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",

    "License :: OSI Approved :: MIT License",

    "Operating System :: OS Independent",

    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development"
]

dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "pandas==2.2.3",

    "tensorflow==2.10.1",
    "keras==2.10.0",

    "networkx==3.4.2",

    "matplotlib==3.10.3",

    "scikit-learn==1.7.1"
]

# ==============================================================================
# Optional Development Dependencies
# ==============================================================================

[project.optional-dependencies]

dev = [

    "pytest==8.4.1",
    "pytest-cov==6.2.1",

    "black==25.1.0",
    "ruff==0.12.8",
    "isort==6.0.1",

    "build==1.3.0",
    "twine==6.1.0",

    "jupyterlab==4.4.4",
    "ipykernel==6.29.5"
]

# ==============================================================================
# Project URLs
# ==============================================================================

[project.urls]

Homepage = "https://github.com/rohitshetye20-ux/Taxi-Route-Recommender-Replication"

Repository = "https://github.com/rohitshetye20-ux/Taxi-Route-Recommender-Replication"

Documentation = "https://github.com/rohitshetye20-ux/Taxi-Route-Recommender-Replication/tree/main/docs"

Issues = "https://github.com/rohitshetye20-ux/Taxi-Route-Recommender-Replication/issues"

# ==============================================================================
# Setuptools
# ==============================================================================

[tool.setuptools]

include-package-data = true

[tool.setuptools.packages.find]

where = ["."]

include = [
    "src*",
    "scripts*"
]

# ==============================================================================
# Pytest
# ==============================================================================

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

python_functions = [
    "test_*"
]

addopts = """
-v
-ra
--strict-markers
--cov=src
--cov-report=term-missing
"""

# ==============================================================================
# Coverage
# ==============================================================================

[tool.coverage.run]

source = [
    "src"
]

omit = [
    "tests/*",
    "**/__pycache__/*"
]

[tool.coverage.report]

show_missing = true

skip_empty = true

# ==============================================================================
# Black
# ==============================================================================

[tool.black]

line-length = 88

target-version = [
    "py310"
]

# ==============================================================================
# isort
# ==============================================================================

[tool.isort]

profile = "black"

line_length = 88

# ==============================================================================
# Ruff
# ==============================================================================

[tool.ruff]

line-length = 88

target-version = "py310"

# ==============================================================================
# End of File
# ==============================================================================